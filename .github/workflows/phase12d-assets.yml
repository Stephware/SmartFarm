name: Phase 12D asset regeneration (temporary)

on:
  push:
    branches:
      - feature/web-ui-phase-12d-farm-crops

permissions:
  contents: write

concurrency:
  group: phase12d-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compiled AniGo styles
        run: |
          npm ci --no-audit --no-fund
          npm run css:build
          node --test tests/web-ui/phase12d-farm-crops.test.cjs
      - name: Build and check MVC implementation
        run: |
          dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
          dotnet test tests/SmartFarm.Auth.Tests/SmartFarm.Auth.Tests.csproj --configuration Release --filter "FullyQualifiedName~Phase12DFarmAndCropWorkflowsRespectRoles"
      - name: Set up pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start MVC app
        run: |
          (cd src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5082 dotnet bin/Release/net10.0/SmartFarm.Web.dll) >/tmp/phase12d-mvc.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase12d-mvc.log
          exit 1
      - name: Update screenshot candidates for current CSS
        env:
          ANIGO_UPDATE_VISUAL_BASELINES: '1'
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
        run: node tests/browser/visual-parity.cjs
      - name: Check real authenticated crop and farm views in Chromium
        env:
          ANIGO_CAPTURE_AUTH_FIXTURES: '1'
          SMARTFARM_BROWSER_BASE_URL: http://127.0.0.1:5082
        run: |
          dotnet test tests/SmartFarm.Auth.Tests/SmartFarm.Auth.Tests.csproj --configuration Release --filter "FullyQualifiedName~AuthenticatedBrowserFixtures"
          node tests/browser/authenticated-smoke.cjs
      - name: Save generated CSS and visual samples
        run: |
          mkdir -p tests/browser/phase12d-review
          cp tests/browser/screenshots/authenticated/12d-farm-owner-light-375.png tests/browser/phase12d-review/farm-owner-phone.png
          cp tests/browser/screenshots/authenticated/12d-plots-owner-light-1440.png tests/browser/phase12d-review/plots-desktop.png
          cp tests/browser/screenshots/authenticated/12d-crops-owner-dark-375.png tests/browser/phase12d-review/crops-owner-dark-phone.png
          cp tests/browser/screenshots/authenticated/12d-crops-worker-light-768.png tests/browser/phase12d-review/crops-worker-tablet.png
          cp tests/browser/screenshots/authenticated/12d-edit-plan-light-1024.png tests/browser/phase12d-review/edit-plan-desktop.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css tests/browser/baselines/ tests/browser/phase12d-review/
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild Phase 12D styles and screenshots'
            git pull --rebase origin feature/web-ui-phase-12d-farm-crops
            git push origin HEAD:feature/web-ui-phase-12d-farm-crops
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12d-review-candidates
          if-no-files-found: ignore
          path: |
            tests/browser/parity-output/
            tests/browser/screenshots/authenticated/
