name: AniGo carabao onboarding final audit
on:
  push:
    branches: [feature/anigo-carabao-onboarding]
    paths:
      - 'mobile/SmartFarm.Android/**'
      - '.github/workflows/anigo-carabao-phase1-2-verify.yml'
permissions:
  contents: read
concurrency:
  group: carabao-onboarding-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Build and test AniGo onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/SmartFarm.Android/**/*.gradle.kts
      - name: Install Android compile SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android, UI tests and unit tests
        working-directory: mobile/SmartFarm.Android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleAndroidTest :app:testDebugUnitTest
  emulator:
    name: Emulator tests and visual captures
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/SmartFarm.Android/**/*.gradle.kts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Run onboarding instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          working-directory: mobile/SmartFarm.Android
          script: >-
            bash -c 'bash ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.smartfarm.mobile.CarabaoOnboardingPreviewTest,com.smartfarm.mobile.PhotoAuthScreensTest,com.smartfarm.mobile.Phase6WelcomeScreenTest,com.smartfarm.mobile.FarmOnboardingScreenTest,com.smartfarm.mobile.WelcomeScreenTest;
            test_exit=$?;
            mkdir -p app/build/ui-screenshots;
            adb shell run-as com.smartfarm.mobile ls files/anigo-onboarding || true;
            missing=0;
            for name in 01-farm-light 02-crop-light 03-work-light 04-harvest-light 01-farm-dark 02-crop-dark 03-work-dark 04-harvest-dark intro-light farm-320dp-large-text; do
              target="app/build/ui-screenshots/${name}.png";
              if ! adb exec-out run-as com.smartfarm.mobile cat "files/anigo-onboarding/${name}.png" > "$target"; then missing=1; fi;
              if ! file --mime-type "$target" | grep -q image/png; then missing=1; fi;
            done;
            find app/build/ui-screenshots -type f -printf "%f %s bytes\\n";
            if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi;
            if [ "$missing" -ne 0 ]; then exit 1; fi;'
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carabao-onboarding-preview-tests
          if-no-files-found: ignore
          path: |
            mobile/SmartFarm.Android/app/build/outputs/androidTest-results/connected/
            mobile/SmartFarm.Android/app/build/reports/androidTests/connected/
            mobile/SmartFarm.Android/app/build/ui-screenshots/
