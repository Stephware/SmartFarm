# One-time, branch-restricted screenshot capture for the explicitly approved
# Phase 6 landing redesign. Delete this workflow after visual review.
name: Capture AniGo Phase 6 landing baselines
on:
  push:
    branches: ["feature/anigo-phase6-visual-landing"]
permissions:
  contents: write
jobs:
  capture:
    if: "!contains(github.event.head_commit.message, '[phase6-captured]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build MVC
        run: dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
      - name: Install fixed Chromium dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
          npx playwright install --with-deps chromium
      - name: Start temporary localhost site
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5082
        run: |
          (cd src/SmartFarm.Web && dotnet bin/Release/net10.0/SmartFarm.Web.dll) > /tmp/anigo-phase6.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/anigo-phase6.log
          exit 1
      - name: Capture candidate screenshots at all public widths/themes
        env:
          ANIGO_UPDATE_VISUAL_BASELINES: "1"
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
        run: node tests/browser/visual-parity.cjs
      - name: Record source hashes and require visual review
        run: |
          node - <<'NODE'
          const fs=require("fs"),path=require("path"),crypto=require("crypto");
          const script=fs.readFileSync("tests/browser/visual-parity.cjs","utf8");
          const root="src/SmartFarm.Web/";
          const files=["wwwroot/css/anigo-tailwind.css","wwwroot/css/anigo-landing-phase6.css",
            "Views/Shared/_Layout.cshtml","Views/Home/Index.cshtml",
            "Views/Account/Login.cshtml","Views/Account/Register.cshtml"];
          const manifestPath="tests/browser/baselines/review.json";
          const manifest=JSON.parse(fs.readFileSync(manifestPath,"utf8"));
          manifest.sourceHashes=Object.fromEntries(files.map(f=>[f,crypto.createHash("sha256")
            .update(fs.readFileSync(path.join(root,f))).digest("hex")]));
          manifest.reviewed=false;
          manifest.note="Phase 6: generated all 30 candidate screenshots on Linux from the user-approved photo-led landing direction. These new rendered screenshots MUST be visually inspected before reviewed=true. Login/registration behavior and photos remain unchanged.";
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+"\n");
          NODE
      - name: Commit screenshot candidates to the Phase 6 branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[phase6-captured] Add landing screenshot candidates"
          git push origin HEAD:feature/anigo-phase6-visual-landing
