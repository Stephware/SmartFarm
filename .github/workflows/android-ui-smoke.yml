name: Android farmer journey smoke tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'mobile/SmartFarm.Android/**'
      - '.github/workflows/android-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Farmer journeys on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/SmartFarm.Android/**/*.gradle.kts
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Run key Compose journeys on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          working-directory: mobile/SmartFarm.Android
          script: bash ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.smartfarm.mobile.FinalFarmerJourneysTest,com.smartfarm.mobile.NavigationInputsTest,com.smartfarm.mobile.SecondaryNavigationScreenTest
      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-farmer-journeys
          if-no-files-found: ignore
          path: |
            mobile/SmartFarm.Android/app/build/outputs/androidTest-results/connected/
            mobile/SmartFarm.Android/app/build/reports/androidTests/connected/
