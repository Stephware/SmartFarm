name: AniGo Logo Baseline Review
# Re-capture after light footer contrast and compact mobile authentication adjustments.
on:
  push:
    branches: [feature/anigo-approved-logo]
    paths: [.github/workflows/anigo-logo-baselines.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile candidate MVC site
        run: dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
      - name: Install baseline comparison tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start candidate MVC app
        run: |
          (cd src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5082 dotnet bin/Release/net10.0/SmartFarm.Web.dll) > /tmp/anigo-logo-candidate.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/anigo-logo-candidate.log
          exit 1
      - name: Capture all 30 unreviewed public-page baselines
        env:
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
          ANIGO_UPDATE_VISUAL_BASELINES: "1"
        run: node tests/browser/visual-parity.cjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anigo-logo-baseline-candidates
          if-no-files-found: warn
          retention-days: 3
          path: |
            tests/browser/baselines/*.png
            tests/browser/baselines/review.json
            /tmp/anigo-logo-candidate.log
