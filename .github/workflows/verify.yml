name: SmartFarm checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartfarm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SmartFarm.slnx
      - name: Build
        run: dotnet build SmartFarm.slnx --no-restore -c Release
      - name: Test
        run: dotnet test SmartFarm.slnx --no-build -c Release

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/SmartFarm.Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

  sql-integration:
    name: SQL Server end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'SmartFarmCI2026!Pass'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Create disposable SQL database
        env:
          SQL_CONTAINER: ${{ job.services.sql.id }}
          SQL_PASSWORD: 'SmartFarmCI2026!Pass'
        run: |
          set -euo pipefail
          SQLCMD="$(docker exec "$SQL_CONTAINER" sh -c 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi')"
          test -n "$SQLCMD" || { echo "SQL Server image has no sqlcmd."; exit 1; }
          for i in $(seq 1 60); do
            if docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SELECT 1"
          for script in 01_CreateDatabase 02_CreateSchema; do
            docker cp "database/$script.sql" "$SQL_CONTAINER:/tmp/$script.sql"
          done
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -i /tmp/01_CreateDatabase.sql
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -d SmartFarmDB -i /tmp/02_CreateSchema.sql
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -d SmartFarmDB -Q "IF (SELECT COUNT(*) FROM sys.tables WHERE schema_id = SCHEMA_ID('dbo')) <> 23 THROW 50003, 'Schema table count mismatch.', 1"
      - name: Verify full farm and sync workflow
        env:
          SMARTFARM_TEST_CONNECTION: 'Server=127.0.0.1,1433;Database=SmartFarmDB;User ID=sa;Password=SmartFarmCI2026!Pass;Encrypt=True;TrustServerCertificate=True'
        run: dotnet test tests/SmartFarm.Api.Tests/SmartFarm.Api.Tests.csproj -c Release --filter FullyQualifiedName~OwnerCanManageFarmToHarvestWorkflow_WhenTestDatabaseIsConfigured
