name: Review Phase 12B intermediate widths
on:
  push:
    branches:
      - feature/web-ui-phase-12b-entry-onboarding
    paths:
      - .github/workflows/phase12b-review-remaining.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render 320/768/1024 visual contact sheets from captured goldens
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import base64, io
          root=Path('tests/browser/baselines')
          for mode in ('light','dark'):
              for width in (320,768,1024):
                  sources=[(name,root/f'{name}-{mode}-{width}.png')
                      for name in ('landing','login','registration')]
                  cardw=390
                  canvas=Image.new('RGB',(cardw*3,1050),'#eef2ee')
                  for i,(name,p) in enumerate(sources):
                      img=Image.open(p).convert('RGB')
                      target=cardw-14
                      h=min(1010,round(img.height*target/img.width))
                      img=img.resize((target,h))
                      canvas.paste(img,(i*cardw+7,32))
                      ImageDraw.Draw(canvas).text((i*cardw+8,10),
                          f'{mode} {width}px {name}',fill='#21392b')
                  file=io.BytesIO()
                  canvas.save(file,format='JPEG',quality=65,optimize=True)
                  payload=base64.b64encode(file.getvalue()).decode('ascii')
                  tag='ANIGO_12B_MORE_'+mode.upper()+'_'+str(width)
                  print(tag+'_BEGIN')
                  for offset in range(0,len(payload),2200):
                      print(tag+':'+payload[offset:offset+2200])
                  print(tag+'_END')
          PY
