name: Phase 12B asset regeneration (temporary)

on:
  push:
    branches:
      - feature/web-ui-phase-12b-completion

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compiled design system
        run: |
          npm ci --no-audit --no-fund
          npm run css:build
      - name: Build MVC application
        run: dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
      - name: Set up pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start MVC app
        run: |
          (cd src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5082 dotnet bin/Release/net10.0/SmartFarm.Web.dll) >/tmp/phase12b-mvc.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase12b-mvc.log
          exit 1
      - name: Capture updated public screenshots
        env:
          ANIGO_UPDATE_VISUAL_BASELINES: '1'
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
        run: node tests/browser/visual-parity.cjs
      - name: Commit compiled CSS and unreviewed screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css tests/browser/baselines/
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild CSS and capture Phase 12B screens'
            git pull --rebase origin feature/web-ui-phase-12b-completion
            git push origin HEAD:feature/web-ui-phase-12b-completion
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12b-public-candidates
          if-no-files-found: ignore
          path: |
            tests/browser/parity-output/
            /tmp/phase12b-mvc.log
