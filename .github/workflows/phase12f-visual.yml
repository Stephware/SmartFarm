name: Phase 12F visual verification (temporary)
on:
  push:
    branches:
      - feature/web-ui-phase-12f-final-audit
permissions:
  contents: write
concurrency:
  group: phase12f-visual
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build design system and check admin source
        run: |
          npm ci --no-audit --no-fund
          npm run css:build
          node --test tests/web-ui/phase12f-admin.test.cjs
      - name: Compile and render actual admin Razor views
        run: |
          dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj -c Release
          dotnet test tests/SmartFarm.Auth.Tests/SmartFarm.Auth.Tests.csproj -c Release --filter "FullyQualifiedName~Phase12FAdminViewTests"
      - name: Install pinned browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start candidate MVC app
        run: |
          (cd src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5082 dotnet bin/Release/net10.0/SmartFarm.Web.dll) > /tmp/phase12f-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5082/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase12f-web.log
          exit 1
      - name: Regenerate public screenshot candidates
        env:
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
          ANIGO_UPDATE_VISUAL_BASELINES: '1'
        run: node tests/browser/visual-parity.cjs
      - name: Test actual Super Admin pages across mobile and desktop
        env:
          ANIGO_CAPTURE_ADMIN_FIXTURES: '1'
          SMARTFARM_BROWSER_BASE_URL: http://127.0.0.1:5082
        run: |
          dotnet test tests/SmartFarm.Auth.Tests/SmartFarm.Auth.Tests.csproj -c Release --filter "FullyQualifiedName~Phase12FAdminBrowserFixtures"
          node tests/browser/phase12f-admin-smoke.cjs
      - name: Save representative reviewed-ready admin screenshots
        run: |
          mkdir -p tests/browser/phase12f-review
          cp tests/browser/screenshots/phase12f/overview-light-1440.png tests/browser/phase12f-review/overview-desktop.png
          cp tests/browser/screenshots/phase12f/users-light-375.png tests/browser/phase12f-review/users-phone.png
          cp tests/browser/screenshots/phase12f/farms-dark-375.png tests/browser/phase12f-review/farms-dark-phone.png
          cp tests/browser/screenshots/phase12f/monitoring-light-768.png tests/browser/phase12f-review/monitoring-tablet.png
          cp tests/browser/screenshots/phase12f/audit-dark-1440.png tests/browser/phase12f-review/audit-dark-desktop.png
          cp tests/browser/screenshots/phase12f/reports-light-375.png tests/browser/phase12f-review/reports-phone.png
          cp tests/browser/screenshots/phase12f/security-dark-375.png tests/browser/phase12f-review/security-dark-phone.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css tests/browser/baselines/ tests/browser/phase12f-review/
          if ! git diff --cached --quiet; then
            git commit -m 'Build Phase 12F styles and capture admin screens'
            git pull --rebase origin feature/web-ui-phase-12f-final-audit
            git push origin HEAD:feature/web-ui-phase-12f-final-audit
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12f-admin-candidates
          if-no-files-found: ignore
          path: |
            tests/browser/screenshots/phase12f/
            tests/browser/parity-output/
