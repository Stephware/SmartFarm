name: Phase 12E asset regeneration (temporary)

on:
  push:
    branches:
      - feature/web-ui-phase-12e-operations

permissions:
  contents: write

concurrency:
  group: phase12e-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile new operations styles and regression tests
        run: |
          npm ci --no-audit --no-fund
          npm run css:build
          node --test tests/web-ui/phase12e-operations.test.cjs
      - name: Build and test MVC operations
        run: |
          dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
          dotnet test tests/SmartFarm.Auth.Tests/SmartFarm.Auth.Tests.csproj --configuration Release --filter "FullyQualifiedName~Phase12EOperationsRespectFarmRolesAndSavedData"
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start real MVC site
        run: |
          (cd src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5082 dotnet bin/Release/net10.0/SmartFarm.Web.dll) >/tmp/phase12e-mvc.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase12e-mvc.log
          exit 1
      - name: Generate candidate responsive public baselines
        env:
          ANIGO_UPDATE_VISUAL_BASELINES: '1'
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
        run: node tests/browser/visual-parity.cjs
      - name: Test signed-in field operations
        env:
          ANIGO_CAPTURE_AUTH_FIXTURES: '1'
          SMARTFARM_BROWSER_BASE_URL: http://127.0.0.1:5082
        run: |
          dotnet test tests/SmartFarm.Auth.Tests/SmartFarm.Auth.Tests.csproj --configuration Release --filter "FullyQualifiedName~Phase12EAuthenticatedBrowserFixtures"
          node tests/browser/phase12e-smoke.cjs
      - name: Commit CSS and selected screenshot samples
        run: |
          mkdir -p tests/browser/phase12e-review
          cp tests/browser/screenshots/phase12e/12e-tasks-worker-light-375.png tests/browser/phase12e-review/tasks-worker-mobile.png
          cp tests/browser/screenshots/phase12e/12e-monitoring-worker-dark-375.png tests/browser/phase12e-review/monitoring-worker-dark-mobile.png
          cp tests/browser/screenshots/phase12e/12e-harvests-owner-light-1024.png tests/browser/phase12e-review/harvests-desktop.png
          cp tests/browser/screenshots/phase12e/12e-inventory-owner-light-1440.png tests/browser/phase12e-review/inventory-desktop.png
          cp tests/browser/screenshots/phase12e/12e-stock-worker-dark-375.png tests/browser/phase12e-review/stock-worker-dark-mobile.png
          cp tests/browser/screenshots/phase12e/12e-weather-stale-light-375.png tests/browser/phase12e-review/weather-stale-mobile.png
          cp tests/browser/screenshots/phase12e/12e-reports-light-768.png tests/browser/phase12e-review/reports-tablet.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css tests/browser/baselines/ tests/browser/phase12e-review/
          if ! git diff --cached --quiet; then
            git commit -m 'Build Phase 12E CSS and browser screenshots'
            git pull --rebase origin feature/web-ui-phase-12e-operations
            git push origin HEAD:feature/web-ui-phase-12e-operations
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12e-browser-review
          if-no-files-found: ignore
          path: |
            tests/browser/parity-output/
            tests/browser/screenshots/phase12e/
            /tmp/phase12e-mvc.log
