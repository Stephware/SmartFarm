name: Verify SmartFarm

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartfarm-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: API, MVC, Worker and schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate local crop illustrations
        run: python3 scripts/verify-web-visual-assets.py
      - name: Verify web navigation behavior
        run: node --test tests/web-ui/*.test.cjs
      - name: Restore
        run: dotnet restore SmartFarm.slnx
      - name: Build
        run: dotnet build SmartFarm.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test SmartFarm.slnx --configuration Release --no-build --no-restore
      # SQL-backed workflow tests require a separately initialized disposable
      # database and are intentionally not run against developer/production data.

  android:
    name: Android build and Retrofit/Room unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/SmartFarm.Android/**/*.gradle.kts
      # ubuntu-latest already provides Android command-line tools. Installing
      # obsolete SDK "tools" through setup-android fails on recent runners.
      - name: Install Android SDK 36
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android, compile device tests and run unit tests
        working-directory: mobile/SmartFarm.Android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleAndroidTest :app:testDebugUnitTest
      # Instrumentation tests are compiled in CI, but need an emulator to execute.

  browser-smoke:
    name: Chromium responsive web smoke tests
    # Pin to a Playwright-supported runner; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the real MVC site
        run: dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start the public MVC site
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5082
        run: |
          (cd src/SmartFarm.Web && dotnet bin/Release/net10.0/SmartFarm.Web.dll) > /tmp/smartfarm-web-smoke.log 2>&1 &
          echo $! > /tmp/smartfarm-web-smoke.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/smartfarm-web-smoke.log
          exit 1
      - name: Check real-browser navigation and responsive behavior
        env:
          SMARTFARM_BROWSER_BASE_URL: http://127.0.0.1:5082
        run: node tests/browser/web-smoke.cjs
      - name: Upload browser screenshots and startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-smoke
          if-no-files-found: ignore
          path: |
            tests/browser/screenshots/
            /tmp/smartfarm-web-smoke.log

  tailwind-asset:
    name: Build AniGo Tailwind CSS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve locked stylesheet dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Compile prefixed Tailwind CSS (no Preflight)
        run: |
          npm ci --no-audit --no-fund
          npm run css:build
          test -s src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css
      - name: Export generated CSS and lock for baseline commit
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [label, file] of [
            ['LOCK', 'package-lock.json'],
            ['CSS', 'src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css']
          ]) {
            const data = fs.readFileSync(file).toString('base64');
            for (let i = 0; i < data.length; i += 3000)
              console.log('ANIGO_' + label + '_B64:' + data.slice(i, i + 3000));
          }
          NODE
      - name: Save compiled design system
        uses: actions/upload-artifact@v4
        with:
          name: anigo-tailwind-asset
          path: |
            package-lock.json
            src/SmartFarm.Web/wwwroot/css/anigo-tailwind.css

  visual-parity:
    name: Before/after Chromium screenshots
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout unmodified visual baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: baseline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile candidate and original MVC sites
        run: |
          dotnet build src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
          dotnet build baseline/src/SmartFarm.Web/SmartFarm.Web.csproj --configuration Release
      - name: Install browser screenshot comparison tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start candidate and original MVC apps
        run: |
          (cd src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5082 dotnet bin/Release/net10.0/SmartFarm.Web.dll) > /tmp/anigo-candidate.log 2>&1 &
          (cd baseline/src/SmartFarm.Web && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5083 dotnet bin/Release/net10.0/SmartFarm.Web.dll) > /tmp/anigo-baseline.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5082/ >/dev/null &&
               curl --fail --silent http://127.0.0.1:5083/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/anigo-candidate.log /tmp/anigo-baseline.log
          exit 1
      - name: Reject unintended visual differences
        env:
          ANIGO_CANDIDATE_URL: http://127.0.0.1:5082
          ANIGO_BASELINE_URL: http://127.0.0.1:5083
        run: node tests/browser/visual-parity.cjs
      - name: Save before/after/diff screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anigo-before-after
          if-no-files-found: ignore
          path: |
            tests/browser/parity-output/
            /tmp/anigo-candidate.log
            /tmp/anigo-baseline.log
